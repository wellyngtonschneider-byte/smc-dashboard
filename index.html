<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMC Intelligence · Market Report</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Serif:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #0a0c10;
  --bg2:       #0e1116;
  --bg3:       #13161d;
  --line:      #1e2330;
  --line2:     #252b38;

  --long:      #2ecc8a;
  --long-bg:   rgba(46,204,138,0.07);
  --long-line: rgba(46,204,138,0.2);

  --short:     #e05252;
  --short-bg:  rgba(224,82,82,0.07);
  --short-line:rgba(224,82,82,0.2);

  --amber:     #d4a017;
  --steel:     #7a8499;
  --ghost:     #3a4155;

  --text:      #c8cdd8;
  --text-hi:   #eceef2;
  --text-lo:   #555e72;
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

/* ── LAYOUT ── */
.shell { max-width: 1320px; margin: 0 auto; padding: 0 24px 60px; }

/* ── TOPBAR ── */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 0 18px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 28px;
  gap: 16px; flex-wrap: wrap;
}

.brand { display: flex; align-items: center; gap: 16px; }

.brand-rule {
  width: 3px; height: 28px;
  background: var(--long);
  border-radius: 2px;
  flex-shrink: 0;
}

.brand-copy {}
.brand-copy h1 {
  font-family: 'IBM Plex Serif', serif;
  font-size: 1.05rem; font-weight: 500;
  color: var(--text-hi); letter-spacing: 0.01em;
}
.brand-copy p {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.62rem; color: var(--text-lo);
  letter-spacing: 0.08em; text-transform: uppercase;
  margin-top: 2px;
}

.topbar-right { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }

.live-indicator {
  display: flex; align-items: center; gap: 8px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.62rem; color: var(--long);
  text-transform: uppercase; letter-spacing: 0.1em;
}

.live-dot {
  width: 5px; height: 5px;
  background: var(--long);
  border-radius: 50%;
  animation: livepulse 2s ease-in-out infinite;
}

@keyframes livepulse {
  0%,100% { opacity: 1; }
  50% { opacity: 0.35; }
}

.timestamp {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.65rem; color: var(--text-lo);
}

/* ── TICKER ── */
.ticker-strip {
  display: flex; gap: 0;
  border: 1px solid var(--line);
  border-radius: 4px;
  overflow-x: auto;
  margin-bottom: 24px;
  background: var(--bg2);
  scrollbar-width: none;
}
.ticker-strip::-webkit-scrollbar { display: none; }

.t-item {
  display: flex; flex-direction: column;
  padding: 10px 20px;
  border-right: 1px solid var(--line);
  flex-shrink: 0;
  min-width: 100px;
}
.t-item:last-child { border-right: none; }

.t-sym {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.6rem; color: var(--text-lo);
  text-transform: uppercase; letter-spacing: 0.1em;
  margin-bottom: 3px;
}
.t-price {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.88rem; font-weight: 500; color: var(--text-hi);
}
.t-chg {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.65rem; margin-top: 1px;
}
.up   { color: var(--long); }
.down { color: var(--short); }
.flat { color: var(--text-lo); }

/* ── SIGNAL BANNER ── */
.signal-banner {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 32px; align-items: stretch;
  border: 1px solid var(--line2);
  border-radius: 4px;
  margin-bottom: 20px;
  background: var(--bg2);
  overflow: hidden;
}

.signal-banner.is-long  { border-left: 3px solid var(--long); }
.signal-banner.is-short { border-left: 3px solid var(--short); }

.sig-left {
  padding: 24px 28px;
  display: flex; flex-direction: column; gap: 10px;
}

.sig-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.6rem; color: var(--text-lo);
  text-transform: uppercase; letter-spacing: 0.12em;
}

.sig-title {
  font-family: 'IBM Plex Serif', serif;
  font-size: 1.6rem; font-weight: 500;
  color: var(--text-hi); line-height: 1.2;
}

.sig-dir {
  display: inline-flex; align-items: center; gap: 8px;
  margin-top: 2px;
}

.dir-badge {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.68rem; font-weight: 600;
  padding: 3px 10px; border-radius: 3px;
  text-transform: uppercase; letter-spacing: 0.08em;
}

.long-badge  { background: var(--long-bg);  color: var(--long);  border: 1px solid var(--long-line); }
.short-badge { background: var(--short-bg); color: var(--short); border: 1px solid var(--short-line);}

.sig-sub {
  font-size: 0.82rem; color: var(--steel); line-height: 1.6;
  max-width: 560px;
}

.sig-right {
  padding: 24px 32px;
  border-left: 1px solid var(--line);
  display: flex; flex-direction: column;
  align-items: flex-end; justify-content: center;
  gap: 10px; min-width: 180px;
}

.conf-number {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 2.8rem; font-weight: 600; line-height: 1;
}

.conf-hi  { color: var(--long); }
.conf-mid { color: var(--amber); }
.conf-lo  { color: var(--short); }

.conf-tag {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.12em;
  color: var(--text-lo);
}

.conf-bar {
  width: 140px; height: 2px;
  background: var(--ghost); border-radius: 1px;
  overflow: hidden;
}
.conf-fill {
  height: 100%; border-radius: 1px;
  transition: width 1s ease;
}
.is-long  .conf-fill { background: var(--long); }
.is-short .conf-fill { background: var(--short); }
.is-mid   .conf-fill { background: var(--amber) !important; }

/* ── FACTORS ── */
.factors-strip {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  border: 1px solid var(--line);
  border-radius: 4px;
  overflow: hidden;
  margin-bottom: 20px;
  background: var(--bg2);
}

@media (max-width: 900px) { .factors-strip { grid-template-columns: repeat(4, 1fr); } }
@media (max-width: 500px) { .factors-strip { grid-template-columns: repeat(2, 1fr); } }

.fc-item {
  padding: 12px 14px;
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 4px;
}
.fc-item:last-child { border-right: none; }

.fc-item.ok   { background: var(--long-bg); }
.fc-item.fail { opacity: 0.45; }

.fc-check { font-size: 0.8rem; }
.fc-name  { font-size: 0.65rem; color: var(--text-lo); line-height: 1.3; }
.fc-pts   { font-family: 'IBM Plex Mono', monospace; font-size: 0.68rem; font-weight: 600; }
.fc-item.ok   .fc-pts { color: var(--long); }
.fc-item.fail .fc-pts { color: var(--ghost); }

/* ── GRID ── */
.row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
.row-3 { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 16px; margin-bottom: 16px; }
.span-all { grid-column: 1 / -1; }

@media (max-width: 900px) { .row-2, .row-3 { grid-template-columns: 1fr; } }

/* ── PANEL ── */
.panel {
  background: var(--bg2);
  border: 1px solid var(--line2);
  border-radius: 4px;
}

.panel-head {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 18px;
  border-bottom: 1px solid var(--line);
}

.panel-head h2 {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.62rem; font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.12em;
  color: var(--text-lo);
}

.panel-icon { font-size: 0.8rem; }

.panel-body { padding: 16px 18px; }

/* ── SETUP TABLE ── */
.setup-table { width: 100%; border-collapse: collapse; }

.setup-table tr { border-bottom: 1px solid var(--line); }
.setup-table tr:last-child { border-bottom: none; }

.setup-table td {
  padding: 10px 0;
  vertical-align: top;
}

.setup-table td:first-child {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.62rem; color: var(--text-lo);
  text-transform: uppercase; letter-spacing: 0.1em;
  width: 40%; padding-right: 16px;
  padding-top: 11px;
}

.setup-table td:last-child {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.84rem; font-weight: 500;
  color: var(--text-hi);
}

.entry-val { color: #7eb8f7 !important; }
.sl-val    { color: var(--short) !important; }
.tp-val    { color: var(--long) !important; }
.sweep-val { color: var(--amber) !important; font-size: 0.76rem !important; }
.dir-val   {}
.note-val  { font-size: 0.76rem !important; color: var(--steel) !important; }

/* ── ASSET TABLE ── */
.asset-table { width: 100%; border-collapse: collapse; }

.asset-table tr { border-bottom: 1px solid var(--line); }
.asset-table tr:last-child { border-bottom: none; }
.asset-table tr:hover td { background: var(--bg3); }

.asset-table td {
  padding: 9px 0;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.78rem;
}

.asset-table td:nth-child(1) { color: var(--text-hi); font-weight: 600; width: 80px; }
.asset-table td:nth-child(2) { color: var(--text-lo); width: 80px; }
.asset-table td:nth-child(3) { width: 90px; }
.asset-table td:nth-child(4) { color: var(--text-lo); font-size: 0.68rem; text-align: right; }

.bias-tag {
  display: inline-block;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.58rem; font-weight: 600;
  padding: 2px 8px; border-radius: 2px;
  text-transform: uppercase; letter-spacing: 0.06em;
}
.bull-tag { background: var(--long-bg);  color: var(--long);  border: 1px solid var(--long-line); }
.bear-tag { background: var(--short-bg); color: var(--short); border: 1px solid var(--short-line);}
.neut-tag { background: rgba(58,65,85,0.3); color: var(--text-lo); border: 1px solid var(--line2); }

/* ── EVENTS ── */
.event-list { display: flex; flex-direction: column; gap: 0; }

.ev-item {
  display: flex; gap: 14px;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
  align-items: flex-start;
}
.ev-item:last-child { border-bottom: none; }

.ev-indicator {
  width: 2px; height: 100%; min-height: 30px;
  border-radius: 1px; flex-shrink: 0;
  margin-top: 2px;
}
.ev-high-ind   { background: var(--short); }
.ev-medium-ind { background: var(--amber); }

.ev-time {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.7rem; color: var(--text-lo);
  min-width: 44px; flex-shrink: 0; padding-top: 1px;
}

.ev-details {}
.ev-name { font-size: 0.82rem; font-weight: 500; color: var(--text-hi); }
.ev-meta {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.65rem; color: var(--text-lo); margin-top: 3px;
}

/* ── REPORT ── */
.report-text {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.76rem; line-height: 1.9;
  color: var(--steel);
  white-space: pre-wrap;
}

/* ── DIVIDER ── */
.divider {
  height: 1px; background: var(--line);
  margin: 24px 0;
}

/* ── SECTION LABEL ── */
.section-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.58rem; color: var(--text-lo);
  text-transform: uppercase; letter-spacing: 0.15em;
  margin-bottom: 10px;
  display: flex; align-items: center; gap: 10px;
}
.section-label::after {
  content: '';
  flex: 1; height: 1px; background: var(--line);
}

/* ── FOOTER ── */
footer {
  border-top: 1px solid var(--line);
  padding: 20px 0 0;
  margin-top: 40px;
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 10px;
}

.footer-brand {
  font-family: 'IBM Plex Serif', serif;
  font-size: 0.82rem; color: var(--text-lo);
}

.footer-disclaimer {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.58rem; color: var(--ghost);
  text-align: right; line-height: 1.7;
}

/* ── LOADING ── */
.loading {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; min-height: 60vh; gap: 14px;
}
.spinner {
  width: 28px; height: 28px;
  border: 1.5px solid var(--line2);
  border-top-color: var(--long);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading p {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.65rem; color: var(--text-lo);
  text-transform: uppercase; letter-spacing: 0.12em;
}

/* ── CHART TABS ── */
.chart-tab {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.6rem; font-weight: 500;
  padding: 4px 12px; border-radius: 3px;
  text-transform: uppercase; letter-spacing: 0.08em;
  background: transparent;
  border: 1px solid var(--line2);
  color: var(--text-lo);
  cursor: pointer;
  transition: all 0.15s;
}
.chart-tab:hover { border-color: var(--line); color: var(--text); }
.chart-tab.active {
  background: var(--long-bg);
  border-color: var(--long-line);
  color: var(--long);
}

/* ── FADE ── */
.fade { animation: fadeUp 0.4s ease both; }
@keyframes fadeUp { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
</style>
</head>
<body>
<div class="shell">

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="brand">
      <div class="brand-rule"></div>
      <div class="brand-copy">
        <h1>SMC Intelligence</h1>

<script>
const DEMO = {

  confianca_label: "MODERADA",

  },
  fatores:[

    {nome:"FVG 1H",         ok:true,  pts:"10pts"},
    {nome:"Gatilho M15",    ok:false, pts:"20pts"},
    {nome:"Sem Alto Imp.",  ok:true,  pts:"10pts"},

  ],

  },
  ativos:[

    {nome:"EURUSD",price:"1.1498",bias:"BULLISH",zona:"BSL 1.1530 · OB demand 1.1460"},
    {nome:"USDJPY",price:"159.50",bias:"BEARISH",zona:"BSL 160.00 · OB supply 159.80"},
    {nome:"BTCUSD",price:"$67,846",bias:"NEUTRO", zona:"SSL $65.8k · OB demand $66.2k"},
    {nome:"ETHUSD",price:"$2,092", bias:"BEARISH",zona:"OB bearish $2,120 · suporte $1,980"},
    {nome:"NAS100",price:"23,975", bias:"BULLISH", zona:"Alvo 24,000 · suporte 23,300"},
  ],
  eventos:[
    {hora:"09:15",nome:"ADP Non-Farm Employment Change",impacto:"high",ant:"63K",prev:"41K",resultado:"Aguardando"},
    {hora:"09:30",nome:"Core Retail Sales m/m",impacto:"high",ant:"0.0%",prev:"0.3%",resultado:"Aguardando"},
    {hora:"09:30",nome:"Retail Sales m/m",impacto:"high",ant:"-0.2%",prev:"0.5%",resultado:"Aguardando"},
    {hora:"11:00",nome:"ISM Manufacturing PMI",impacto:"high",ant:"52.4",prev:"52.3",resultado:"Aguardando"},
    {hora:"11:00",nome:"ISM Manufacturing Prices",impacto:"medium",ant:"70.5",prev:"74.0",resultado:"Aguardando"},

  relatorio:`MACRO: DXY recuou após JOLTS fraco (6.87M vs 6.92M esperado), favorecendo ativos de risco e XAUUSD em máximas históricas. NAS100 sustentado acima de 23.900 confirma viés risk-on moderado para a sessão tarde. Correlação invertida DXY/Ouro ativa — monitorar.

function render(d) {
  document.getElementById('ts').textContent = d.timestamp;

  const s = d.setup;
  const isLong = s.direcao === 'LONG';
  const heroClass  = isLong ? 'is-long'  : 'is-short';
  const dirBadge   = isLong ? 'long-badge' : 'short-badge';
  const dirArrow   = isLong ? '↑' : '↓';
  const confClass  = d.confianca >= 75 ? 'conf-hi' : d.confianca >= 50 ? 'conf-mid' : 'conf-lo';
  const midFill    = d.confianca >= 50 && d.confianca < 75 ? 'is-mid' : '';
  const biasTag    = b => b==='BULLISH'?'bull-tag':b==='BEARISH'?'bear-tag':'neut-tag';

  const tickerHTML = Object.entries(d.precos).map(([k,v])=>`
    <div class="t-item" data-sym="${k}">
      <span class="t-sym">${k}</span>
      <span class="t-price">${v.price}</span>
      <span class="t-chg ${v.up?'up':'down'}">${v.change}</span>
    </div>
  `).join('');

  const factorsHTML = d.fatores.map(f=>`
    <div class="fc-item ${f.ok?'ok':'fail'}">
      <span class="fc-check">${f.ok?'✓':'—'}</span>
      <span class="fc-name">${f.nome}</span>
      <span class="fc-pts">${f.ok?'+'+f.pts:'0'}</span>
    </div>
  `).join('');

  const assetsHTML = d.ativos.map(a=>`
    <tr>
      <td>${a.nome}</td>
      <td>${a.price}</td>
      <td><span class="bias-tag ${biasTag(a.bias)}">${a.bias}</span></td>
      <td>${a.zona}</td>
    </tr>
  `).join('');

  const horaAtual = new Date().toLocaleTimeString('pt-BR', {timeZone:'America/Sao_Paulo', hour:'2-digit', minute:'2-digit'});

  const eventsHTML = d.eventos.map(e=>{
    const jaPassou = e.hora <= horaAtual;
    const temResultado = e.resultado && e.resultado !== 'Aguardando';
    const icone = e.impacto === 'high' ? '🔴' : '🟡';
    const opacidade = jaPassou && !temResultado ? 'opacity:0.5;' : '';
    return `
    <div class="ev-item" style="${opacidade}">
      <div class="ev-indicator ${e.impacto==='high'?'ev-high-ind':'ev-medium-ind'}"></div>
      <span class="ev-time">${e.hora}</span>

      </div>

  }).join('');

  document.getElementById('app').innerHTML = `
  <div class="fade">

          <span class="dir-badge ${dirBadge}">${dirArrow} ${s.direcao}</span>

      </div>
      <div class="sig-right">

          <div class="conf-fill" style="width:${d.confianca}%"></div>

    </div>

    <!-- FACTORS -->

    <!-- GRÁFICOS TRADINGVIEW -->
    <div class="panel" style="margin-bottom:16px">
      <div class="panel-head">

        <div class="chart-tabs" style="margin-left:auto;display:flex;gap:4px">
          <button class="chart-tab active" onclick="switchChart('XAUUSD','OANDA:XAUUSD')">XAUUSD</button>
          <button class="chart-tab" onclick="switchChart('GBPUSD','OANDA:GBPUSD')">GBPUSD</button>
          <button class="chart-tab" onclick="switchChart('BTCUSD','BITSTAMP:BTCUSD')">BTCUSD</button>

    <div class="row-3" style="margin-bottom:16px">

            <tr><td>⚠ Aguardar Sweep</td><td class="sweep-val">${s.sweep}</td></tr>

// ── TRADINGVIEW WIDGET ────────────────────────────────────────────────────────

let currentSymbol = 'OANDA:XAUUSD';

function loadTVWidget(symbol) {
  const container = document.getElementById('tv-container');
  if (!container) return;
  container.innerHTML = '';

  const script = document.createElement('script');
  script.src = 'https://s3.tradingview.com/tv.js';
  script.onload = () => {
    new TradingView.widget({
      container_id: 'tv-container',
      symbol: symbol,
      interval: '60',
      timezone: 'America/Sao_Paulo',
      theme: 'dark',
      style: '1',
      locale: 'br',
      toolbar_bg: '#0e1116',
      enable_publishing: false,
      hide_top_toolbar: false,
      hide_legend: false,
      save_image: false,
      backgroundColor: '#0e1116',
      gridColor: 'rgba(30,35,48,0.8)',
      width: '100%',
      height: 440,
      studies: ['Volume@tv-basicstudies'],
      disabled_features: ['header_symbol_search','header_screenshot','header_compare'],
      enabled_features: ['hide_left_toolbar_by_default'],
    });
  };
  document.body.appendChild(script);
}

function switchChart(label, symbol) {
  currentSymbol = symbol;
  // Atualiza tabs
  document.querySelectorAll('.chart-tab').forEach(t => {
    t.classList.toggle('active', t.textContent.trim() === label);
  });
  loadTVWidget(symbol);
}

// ── LIVE PRICES (atualiza ticker a cada 30s independente do bot) ──────────────

let lastPrices = {};   // cache para calcular variação flash

async function fetchLivePrices() {
  const prices = {};

  // 1. BTC + ETH via CoinGecko
  try {
    const r = await fetch(
      'https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum&vs_currencies=usd&include_24hr_change=true',
      { cache: 'no-store' }
    );
    const d = await r.json();
    prices['BTC']    = { price: '$' + d.bitcoin.usd.toLocaleString('en-US',{maximumFractionDigits:0}), change: (d.bitcoin.usd_24h_change||0).toFixed(2)+'%', up: (d.bitcoin.usd_24h_change||0) >= 0, raw: d.bitcoin.usd };
    prices['ETH']    = { price: '$' + d.ethereum.usd.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}), change: (d.ethereum.usd_24h_change||0).toFixed(2)+'%', up: (d.ethereum.usd_24h_change||0) >= 0, raw: d.ethereum.usd };
  } catch {}

  // 2. GBPUSD + EURUSD + USDJPY via Frankfurter
  try {
    const r = await fetch('https://api.frankfurter.app/latest?from=USD&to=GBP,EUR,JPY', { cache: 'no-store' });
    const d = await r.json();
    const gbp = d.rates.GBP ? (1/d.rates.GBP).toFixed(5) : null;
    const eur = d.rates.EUR ? (1/d.rates.EUR).toFixed(5) : null;
    const jpy = d.rates.JPY ? d.rates.JPY.toFixed(3) : null;
    if (gbp) prices['GBPUSD'] = { price: gbp, change: '—', up: true, raw: parseFloat(gbp) };
    if (eur) prices['EURUSD'] = { price: eur, change: '—', up: true, raw: parseFloat(eur) };
    if (jpy) prices['USDJPY'] = { price: jpy, change: '—', up: true, raw: parseFloat(jpy) };
  } catch {}

  // 3. XAUUSD + NAS100 via Yahoo Finance (via proxy cors)
  // Usando allorigins.win como proxy CORS para Yahoo Finance
  try {
    const goldUrl  = 'https://query1.finance.yahoo.com/v8/finance/chart/GC%3DF?interval=1d&range=2d';
    const nasUrl   = 'https://query1.finance.yahoo.com/v8/finance/chart/NQ%3DF?interval=1d&range=2d';
    const proxy    = 'https://api.allorigins.win/get?url=';

    const [rGold, rNas] = await Promise.all([
      fetch(proxy + encodeURIComponent(goldUrl), { cache: 'no-store' }),
      fetch(proxy + encodeURIComponent(nasUrl),  { cache: 'no-store' }),
    ]);

    const parseYahoo = async (resp) => {
      const j = await resp.json();
      const d = JSON.parse(j.contents);
      const closes = d.chart.result[0].indicators.quote[0].close.filter(c => c != null);
      const last   = closes[closes.length - 1];
      const prev   = closes[closes.length - 2] || last;
      const chg    = ((last - prev) / prev * 100).toFixed(2);
      return { last, chg };
    };

    const gold = await parseYahoo(rGold);
    const nas  = await parseYahoo(rNas);

    prices['XAUUSD'] = { price: '$' + gold.last.toFixed(2), change: gold.chg + '%', up: parseFloat(gold.chg) >= 0, raw: gold.last };
    prices['NAS100'] = { price: nas.last.toLocaleString('en-US',{maximumFractionDigits:0}), change: nas.chg + '%', up: parseFloat(nas.chg) >= 0, raw: nas.last };
  } catch {}

  return prices;
}

function updateTicker(prices) {
  Object.entries(prices).forEach(([sym, v]) => {
    const el = document.querySelector(`.t-item[data-sym="${sym}"]`);
    if (!el) return;

    const priceEl  = el.querySelector('.t-price');
    const changeEl = el.querySelector('.t-chg');

    // Flash se preço mudou
    const prev = lastPrices[sym];
    if (prev && prev.raw !== v.raw) {
      const up = v.raw > prev.raw;
      priceEl.style.transition = 'color 0.15s';
      priceEl.style.color = up ? 'var(--long)' : 'var(--short)';
      setTimeout(() => { priceEl.style.color = ''; }, 800);
    }

    priceEl.textContent  = v.price;
    changeEl.textContent = (parseFloat(v.change) >= 0 ? '+' : '') + v.change;
    changeEl.className   = 't-chg ' + (v.up ? 'up' : 'down');
  });

  // Atualiza relógio ao vivo
  const now = new Date();
  const brt = new Intl.DateTimeFormat('pt-BR', {
    timeZone: 'America/Sao_Paulo',
    day:'2-digit', month:'2-digit', year:'numeric',
    hour:'2-digit', minute:'2-digit', second:'2-digit'
  }).format(now);
  document.getElementById('ts').textContent = brt + ' BRT';

  lastPrices = { ...lastPrices, ...prices };
}

async function refreshPrices() {
  const prices = await fetchLivePrices();
  updateTicker(prices);
}

// ── INIT ──────────────────────────────────────────────────────────────────────

async function init() {
  try {
    const r = await fetch('report_data.json?t=' + Date.now());
    if (!r.ok) throw new Error();
    render(await r.json());
  } catch { render(DEMO); }

  // Carrega gráfico após render
  setTimeout(() => loadTVWidget(currentSymbol), 300);

  // Primeira atualização de preço logo após render
  await refreshPrices();
}

init();

// Relatório completo a cada 5 min
setInterval(init, 5 * 60 * 1000);

// Preços ao vivo a cada 30s
setInterval(refreshPrices, 30 * 1000);
</script>
