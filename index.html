<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MarketLens · SMC Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        hsl(220,20%,7%);
  --card:      hsl(220,18%,10%);
  --secondary: hsl(220,16%,14%);
  --muted:     hsl(220,14%,16%);
  --border:    hsl(220,14%,16%);
  --sidebar:   hsl(220,20%,5%);

  --primary:        hsl(168,80%,50%);
  --primary-dim:    hsla(168,80%,50%,0.12);
  --primary-border: hsla(168,80%,50%,0.22);

  --destructive:        hsl(0,72%,55%);
  --destructive-dim:    hsla(0,72%,55%,0.1);
  --destructive-border: hsla(0,72%,55%,0.22);

  --amber:        hsl(45,80%,55%);
  --amber-dim:    hsla(45,80%,55%,0.1);
  --amber-border: hsla(45,80%,55%,0.22);

  --text:    hsl(210,20%,95%);
  --text-lo: hsl(215,15%,55%);
  --radius:  0.75rem;
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
  display: flex;
  min-height: 100vh;
}

/* ── MAIN ── */
#main {
  flex: 1; min-height: 100vh;
  display: flex; flex-direction: column;
}

/* ── TOPBAR ── */
.topbar {
  height: 64px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px;
  background: var(--bg);
  position: sticky; top: 0; z-index: 40;
}

.topbar-left { display: flex; flex-direction: column; gap: 2px; }
.topbar-title { font-size: 1rem; font-weight: 700; }
.topbar-sub { font-size: 0.72rem; color: var(--text-lo); }

.topbar-right { display: flex; align-items: center; gap: 12px; }

.live-badge {
  display: flex; align-items: center; gap: 6px;
  background: var(--primary-dim);
  border: 1px solid var(--primary-border);
  border-radius: 20px; padding: 4px 12px;
  font-size: 0.72rem; color: var(--primary); font-weight: 600;
}
.live-dot { width: 6px; height: 6px; background: var(--primary); border-radius: 50%; animation: blink 1.5s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

.ts { font-size: 0.72rem; color: var(--text-lo); }

/* ── CONTENT ── */
.content { padding: 24px; flex: 1; max-width: 1400px; margin: 0 auto; width: 100%; }

/* ── TICKER ── */
.ticker-wrap {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 0;
  overflow-x: auto; scrollbar-width: none;
  margin-bottom: 20px;
  display: flex;
}
.ticker-wrap::-webkit-scrollbar { display: none; }

.ticker-item {
  display: flex; flex-direction: column; gap: 2px;
  padding: 12px 20px;
  border-right: 1px solid var(--border);
  flex-shrink: 0; min-width: 110px;
  cursor: default;
  transition: background 0.15s;
}
.ticker-item:hover { background: var(--secondary); }
.ticker-item:last-child { border-right: none; }

.t-sym { font-size: 0.6rem; color: var(--text-lo); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 2px; }
.t-price { font-size: 0.95rem; font-weight: 700; }
.t-chg { font-size: 0.68rem; font-weight: 600; }
.up { color: var(--primary); }
.dn { color: var(--destructive); }
.fl { color: var(--text-lo); }

/* ── GRID ── */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 16px; }
.grid-4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 16px; }
.span2 { grid-column: span 2; }
@media(max-width:1100px) { .grid-3 { grid-template-columns: 1fr 1fr; } }
@media(max-width:768px)  { .grid-2,.grid-3,.grid-4 { grid-template-columns: 1fr; } }

/* ── CARD ── */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: calc(var(--radius)*1.5);
  overflow: hidden;
}

.card-header {
  padding: 20px 24px 0;
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 16px;
}
.card-icon-wrap {
  width: 40px; height: 40px;
  border-radius: 12px; background: var(--primary-dim);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; color: var(--primary);
}
.card-title { font-size: 1rem; font-weight: 700; }
.card-sub { font-size: 0.72rem; color: var(--text-lo); margin-top: 1px; }
.card-body { padding: 0 24px 24px; }











/* ── SIGNAL BANNER ── */
.signal-banner {
  border-radius: calc(var(--radius)*1.5);
  border: 1px solid;
  padding: 20px 24px;
  margin-bottom: 16px;
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 16px;
  position: relative; overflow: hidden;
}
.signal-banner::before {
  content: '';
  position: absolute; top: -30px; right: -30px;
  width: 200px; height: 200px;
  border-radius: 50%; filter: blur(60px); opacity: 0.2;
}
.signal-banner.long  { background: linear-gradient(135deg, var(--primary-dim), var(--card)); border-color: var(--primary-border); }
.signal-banner.long::before  { background: var(--primary); }
.signal-banner.short { background: linear-gradient(135deg, var(--destructive-dim), var(--card)); border-color: var(--destructive-border); }
.signal-banner.short::before { background: var(--destructive); }

.sig-left { display: flex; flex-direction: column; gap: 6px; position: relative; }
.sig-eyebrow { font-size: 0.65rem; color: var(--text-lo); text-transform: uppercase; letter-spacing: 0.1em; }
.sig-asset { font-size: 1.8rem; font-weight: 800; letter-spacing: -0.02em; }
.sig-ctx { font-size: 0.82rem; color: var(--text-lo); max-width: 520px; line-height: 1.5; }
.dir-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 0.75rem; font-weight: 700; padding: 4px 12px; border-radius: 20px; border: 1px solid; }
.dir-badge.long  { background: var(--primary-dim);      color: var(--primary);      border-color: var(--primary-border); }
.dir-badge.short { background: var(--destructive-dim);  color: var(--destructive);  border-color: var(--destructive-border); }

.sig-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; position: relative; }
.conf-num { font-size: 3rem; font-weight: 800; line-height: 1; }
.conf-num.hi  { color: var(--primary); }
.conf-num.mid { color: var(--amber); }
.conf-num.lo  { color: var(--destructive); }
.conf-tag { font-size: 0.65rem; color: var(--text-lo); text-transform: uppercase; letter-spacing: 0.1em; }
.conf-bar-wrap { width: 160px; height: 4px; background: var(--muted); border-radius: 2px; overflow: hidden; }
.conf-bar-fill { height: 100%; border-radius: 2px; transition: width 1s ease; }
.signal-banner.long  .conf-bar-fill { background: var(--primary); }
.signal-banner.short .conf-bar-fill { background: var(--destructive); }

/* ── FACTORS ── */
.factors-row {
  display: grid; grid-template-columns: repeat(7,1fr);
  border: 1px solid var(--border); border-radius: var(--radius);
  overflow: hidden; margin-bottom: 16px;
  background: var(--card);
}
@media(max-width:900px) { .factors-row { grid-template-columns: repeat(4,1fr); } }
@media(max-width:500px) { .factors-row { grid-template-columns: repeat(2,1fr); } }

.fc { padding: 12px 14px; border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 4px; }
.fc:last-child { border-right: none; }
.fc.ok { background: var(--primary-dim); }
.fc.fail { opacity: 0.45; }
.fc-check { font-size: 0.9rem; }
.fc-name { font-size: 0.62rem; color: var(--text-lo); line-height: 1.3; }
.fc-pts { font-size: 0.7rem; font-weight: 700; }
.fc.ok   .fc-pts { color: var(--primary); }
.fc.fail .fc-pts { color: var(--border); }

/* ── SETUP LEVELS ── */
.levels-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; margin-bottom: 16px; }
@media(max-width:600px) { .levels-grid { grid-template-columns: 1fr 1fr; } }

.level-card { border-radius: 12px; padding: 14px; }
.level-card.entry { background: var(--secondary); border: 1px solid var(--border); }
.level-card.sl    { background: var(--destructive-dim); border: 1px solid var(--destructive-border); }
.level-card.tp    { background: var(--primary-dim); border: 1px solid var(--primary-border); }
.level-label { font-size: 0.65rem; color: var(--text-lo); margin-bottom: 4px; }
.level-val { font-size: 1.1rem; font-weight: 800; }
.level-card.entry .level-val { color: var(--text); }
.level-card.sl    .level-val { color: var(--destructive); }
.level-card.tp    .level-val { color: var(--primary); }
.level-sub { font-size: 0.65rem; color: var(--text-lo); margin-top: 2px; }

/* RR BAR */
.rr-bar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.rr-label { font-size: 0.72rem; color: var(--text-lo); white-space: nowrap; }
.rr-bar { flex: 1; height: 6px; background: var(--muted); border-radius: 3px; overflow: hidden; }
.rr-fill { height: 100%; background: linear-gradient(90deg, hsla(168,80%,50%,0.5), var(--primary)); border-radius: 3px; }
.rr-val { font-size: 0.95rem; font-weight: 800; color: var(--primary); white-space: nowrap; }

/* SWEEP WARNING */
.sweep-warn {
  display: flex; align-items: flex-start; gap: 10px;
  background: var(--amber-dim); border: 1px solid var(--amber-border);
  border-radius: 10px; padding: 14px; margin-bottom: 12px;
}
.sweep-warn-icon { display:flex; align-items:center; flex-shrink: 0; margin-top: 1px; color: var(--amber); }
.sweep-title { font-size: 0.78rem; font-weight: 700; color: var(--amber); margin-bottom: 4px; }
.sweep-body  { font-size: 0.72rem; color: var(--text-lo); line-height: 1.6; }
.sweep-body b { color: var(--text); }

/* ── PAIR CARDS ── */
.pair-card { background: hsla(220,16%,14%,0.4); border: 1px solid hsla(220,14%,16%,0.6); border-radius: 12px; overflow: hidden; margin-bottom: 8px; }
.pair-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; cursor: pointer; transition: background 0.15s; }
.pair-header:hover { background: hsla(220,16%,16%,0.6); }
.pair-left { display: flex; align-items: center; gap: 10px; }
.pair-sym { font-size: 0.88rem; font-weight: 700; }
.bias-pill { font-size: 0.6rem; font-weight: 700; padding: 2px 8px; border-radius: 20px; border: 1px solid; text-transform: uppercase; letter-spacing: 0.05em; }
.bias-bull { background: var(--primary-dim);      color: var(--primary);      border-color: var(--primary-border); }
.bias-bear { background: var(--destructive-dim);  color: var(--destructive);  border-color: var(--destructive-border); }
.bias-neut { background: var(--amber-dim);        color: var(--amber);        border-color: var(--amber-border); }
.pair-chg { font-size: 0.75rem; font-weight: 600; }
.pair-chevron { display:flex; align-items:center; color: var(--text-lo); transition: transform 0.2s; }
.pair-card.open .pair-chevron { transform: rotate(180deg); }
.pair-body { display: none; padding: 0 16px 14px; }
.pair-card.open .pair-body { display: block; }
.pair-summary { font-size: 0.75rem; color: var(--text-lo); line-height: 1.6; margin-bottom: 12px; }
.tf-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; }
.tf-item { background: hsla(220,18%,10%,0.6); border-radius: 8px; padding: 8px; text-align: center; }
.tf-label { font-size: 0.6rem; font-weight: 700; color: var(--text-lo); margin-bottom: 4px; }
.tf-val { font-size: 0.68rem; }

/* ── EVENTS ── */
.event-item { display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
.event-item:last-child { border-bottom: none; }
.event-bar { width: 3px; min-height: 36px; border-radius: 2px; flex-shrink: 0; margin-top: 2px; }
.ev-high { background: var(--destructive); }
.ev-med  { background: var(--amber); }
.event-time { font-size: 0.72rem; color: var(--text-lo); min-width: 44px; flex-shrink: 0; padding-top: 1px; font-variant-numeric: tabular-nums; }
.event-name { font-size: 0.82rem; font-weight: 600; }
.event-meta { font-size: 0.68rem; color: var(--text-lo); margin-top: 3px; }
.event-result { color: var(--primary); font-weight: 600; }

/* ── REPORT TEXT ── */
.report-text { font-size: 0.78rem; line-height: 1.85; color: var(--text-lo); white-space: pre-wrap; }

/* ── MACRO CARD ── */
.macro-box { background: hsla(220,16%,14%,0.4); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
.macro-box-title { font-size: 0.82rem; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.macro-box-body { font-size: 0.78rem; color: var(--text-lo); line-height: 1.65; }

/* ── ATTENTION ── */
.attn-box { background: var(--destructive-dim); border: 1px solid var(--destructive-border); border-radius: 12px; padding: 16px; }
.attn-title { font-size: 0.82rem; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
.attn-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
.attn-list li { font-size: 0.75rem; color: var(--text-lo); display: flex; align-items: flex-start; gap: 6px; }
.attn-list li::before { content: '•'; color: var(--destructive); flex-shrink: 0; margin-top: 1px; }

/* ── LOADING ── */
.loading { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; gap: 14px; }
.spinner { width: 28px; height: 28px; border: 2px solid var(--muted); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading p { font-size: 0.72rem; color: var(--text-lo); text-transform: uppercase; letter-spacing: 0.1em; }

/* ── FADE ── */
.fade { animation: fadeUp 0.4s ease both; }
@keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }

/* ── CHART ── */
.chart-tabs { display: flex; gap: 4px; margin-left: auto; }
.chart-tab { font-size: 0.65rem; font-weight: 600; padding: 4px 12px; border-radius: 20px; background: none; border: 1px solid var(--border); color: var(--text-lo); cursor: pointer; transition: all 0.15s; }
.chart-tab:hover { border-color: var(--border); color: var(--text); }
.chart-tab.active { background: var(--primary-dim); border-color: var(--primary-border); color: var(--primary); }
</style>
</head>

// ── RENDER ──────────────────────────────────────────────────────────────────
function biasClass(b) {
  return b==='bullish'?'bias-bull':b==='bearish'?'bias-bear':'bias-neut';
}
function biasLabel(b) {
  return b==='bullish'?'BULLISH':b==='bearish'?'BEARISH':'NEUTRO';
}

function render(d) {
  document.getElementById('ts').textContent = d.timestamp;
  document.getElementById('topbarSub').textContent = d.sessao;

  const s = d.setup;
  const isLong = s.direcao === 'LONG';
  const confCls = d.confianca >= 75 ? 'hi' : d.confianca >= 50 ? 'mid' : 'lo';
  const confLabel = d.confianca >= 75 ? 'ALTA' : d.confianca >= 50 ? 'MODERADA' : 'BAIXA';
  const confColor = d.confianca >= 75 ? 'var(--primary)' : d.confianca >= 50 ? 'var(--amber)' : 'var(--destructive)';
  const rrPct = Math.min((parseFloat(s.rr.replace('1:','')) / 5) * 100, 100);

  // Ticker
  const tickerHTML = Object.entries(d.precos).map(([k,v])=>`
    <div class="ticker-item" data-sym="${k}">
      <span class="t-sym">${k}</span>
      <span class="t-price">${v.price}</span>
      <span class="t-chg ${v.up?'up':'dn'}">${v.up?'+':''}${v.change}</span>

  // Factors
  const factorsHTML = d.fatores.map(f=>`
    <div class="fc ${f.ok?'ok':'fail'}">
      <span class="fc-check">${f.ok?'✓':'—'}</span>
      <span class="fc-name">${f.nome}</span>
      <span class="fc-pts">${f.ok?'+'+f.pts:'0'}</span>
    </div>`).join('');

  // Events
  const horaAtual = new Date().toLocaleTimeString('pt-BR',{timeZone:'America/Sao_Paulo',hour:'2-digit',minute:'2-digit'});
  const eventsHTML = d.eventos.map(e=>{
    const passou = e.hora <= horaAtual;
    const temRes = e.resultado && e.resultado !== 'Aguardando';
    const icone  = e.impacto==='high'?'🔴':'🟡';
    return `<div class="event-item" style="${passou&&!temRes?'opacity:0.5':''}">
      <div class="event-bar ${e.impacto==='high'?'ev-high':'ev-med'}"></div>
      <span class="event-time">${e.hora}</span>
      <div>
        <div class="event-name">${icone} ${e.nome}</div>
        <div class="event-meta">ant: ${e.ant} · prev: ${e.prev}${temRes?` · <span class="event-result">✓ ${e.resultado}</span>`:''}</div>
      </div>
    </div>`;
  }).join('');

  // Pairs
  const pairsHTML = d.ativos.map(a=>`
    <div class="pair-card" onclick="this.classList.toggle('open')">
      <div class="pair-header">
        <div class="pair-left">
          <span class="pair-sym">${a.nome}</span>
          <span class="bias-pill ${biasClass(a.bias)}">${biasLabel(a.bias)}</span>
          ${a.chg?`<span class="pair-chg ${a.chg.startsWith('-')?'dn':'up'}">${a.chg}</span>`:''}
        </div>
        <span class="pair-chevron"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></span>
      </div>
      <div class="pair-body">
        <p class="pair-summary">${a.summary}</p>
        <div class="tf-grid">
          ${Object.entries(a.tfs).map(([tf,val])=>`
            <div class="tf-item">
              <div class="tf-label">${tf}</div>
              <div class="tf-val">${val}</div>
            </div>`).join('')}
        </div>
      </div>
    </div>`).join('');

  document.getElementById('app').innerHTML = `
  <div class="fade">

    <!-- TICKER -->
    <div class="ticker-wrap">${tickerHTML}</div>

    

    <!-- SIGNAL BANNER -->
    <div class="signal-banner ${isLong?'long':'short'}">
      <div class="sig-left">
        <span class="sig-eyebrow">Sinal do Dia · ${d.sessao}</span>
        <div class="sig-asset">${s.ativo}</div>
        <div class="dir-badge ${isLong?'long':'short'}">${isLong?`<span style='display:inline-flex;align-items:center;gap:4px'><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg> LONG</span>`:`<span style='display:inline-flex;align-items:center;gap:4px'><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/></svg> SHORT</span>`}</div>
        <div class="sig-ctx">${s.contexto}</div>
      </div>
      <div class="sig-right">
        <div class="conf-num ${confCls}">${d.confianca}%</div>
        <div class="conf-tag">Confiança ${confLabel}</div>
        <div class="conf-bar-wrap">
          <div class="conf-bar-fill" style="width:${d.confianca}%;background:${confColor}"></div>
        </div>
      </div>
    </div>

    <!-- FACTORS -->
    <div class="factors-row">${factorsHTML}</div>

    <!-- SETUP + EVENTS + PAIRS -->
    <div class="grid-3" style="margin-bottom:16px">

      <!-- SETUP -->
      <div class="card span2">
        <div class="card-header">
          <div class="card-icon-wrap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg></div>
          <div>
            <div class="card-title">Setup do Dia — Execução M15</div>
            <div class="card-sub">R:R ${s.rr}</div>
          </div>
        </div>
        <div class="card-body">
          <div class="levels-grid">
            <div class="level-card entry">
              <div class="level-label">Entrada</div>
              <div class="level-val">${s.entrada}</div>
              <div class="level-sub">pós CHoCH M15</div>
            </div>
            <div class="level-card sl">
              <div class="level-label">Stop Loss</div>
              <div class="level-val">${s.sl}</div>
              <div class="level-sub">abaixo estrutura M15</div>
            </div>
            <div class="level-card tp">
              <div class="level-label">TP1 · 1R (50%)</div>
              <div class="level-val">${s.tp1}</div>
              <div class="level-sub">próxima liquidez</div>
            </div>
            <div class="level-card tp">
              <div class="level-label">TP2 · 3R (50%)</div>
              <div class="level-val" style="font-size:1.25rem">${s.tp2}</div>
              <div class="level-sub">liquidez maior</div>
            </div>
          </div>

          <div class="rr-bar-row">
            <span class="rr-label">R:R</span>
            <div class="rr-bar"><div class="rr-fill" style="width:${rrPct}%"></div></div>
            <span class="rr-val">${s.rr}</span>
          </div>

          <div class="sweep-warn">
            <div class="sweep-warn-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div>
            <div>
              <div class="sweep-title">AGUARDANDO GATILHO M15</div>
              <div class="sweep-body"><b>${s.sweep}</b><br>${s.gatilho}<br>Invalidação: <b>${s.invalidacao}</b> · Janela: <b>${s.janela}</b></div>
            </div>
          </div>
        </div>
      </div>

      <!-- EVENTS -->
      <div class="card">
        <div class="card-header">
          <div class="card-icon-wrap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>
          <div>
            <div class="card-title">Agenda · BRT</div>
            <div class="card-sub">Hoje</div>
          </div>
        </div>
        <div class="card-body">${eventsHTML}</div>
      </div>

    </div>

    <!-- GRÁFICOS -->
    <div class="card" style="margin-bottom:16px">
      <div class="card-header">
        <div class="card-icon-wrap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></div>
        <div><div class="card-title">Gráficos · 1H</div></div>
        <div class="chart-tabs">
          <button class="chart-tab active" onclick="switchChart(this,'OANDA:XAUUSD')">XAUUSD</button>
          <button class="chart-tab" onclick="switchChart(this,'OANDA:GBPUSD')">GBPUSD</button>
          <button class="chart-tab" onclick="switchChart(this,'BITSTAMP:BTCUSD')">BTCUSD</button>
          <button class="chart-tab" onclick="switchChart(this,'NASDAQ:QQQ')">NAS100</button>
        </div>
      </div>
      <div style="height:440px;background:var(--card)" id="tv-container"></div>
    </div>

    <!-- ANÁLISE POR PAR + MACRO -->
    <div class="grid-2" style="margin-bottom:16px">
      <div class="card">
        <div class="card-header">
          <div class="card-icon-wrap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg></div>
          <div><div class="card-title">Análise por Par</div><div class="card-sub">Top-Down SMC</div></div>
        </div>
        <div class="card-body">${pairsHTML}</div>
      </div>

      <div style="display:flex;flex-direction:column;gap:12px">
        <div class="card" style="flex:1">
          <div class="card-header">
            <div class="card-icon-wrap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></div>
            <div><div class="card-title">Macro do Dia</div></div>
          </div>
          <div class="card-body">
            <div class="macro-box-body">${d.macro || d.relatorio}</div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <div class="card-icon-wrap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div>
            <div><div class="card-title" style="display:flex;align-items:center;gap:7px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg> Atenção do Dia</div></div>
          </div>
          <div class="card-body">
            <div class="attn-box">
              <ul class="attn-list">
                ${(d.atencao||['Ver análise completa']).map(i=>`<li>${i}</li>`).join('')}
              </ul>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ANÁLISE COMPLETA -->
    ${d.relatorio ? `
    <div class="card" style="margin-bottom:16px">
      <div class="card-header">
        <div class="card-icon-wrap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></div>
        <div><div class="card-title">Análise Completa</div></div>
      </div>
      <div class="card-body">
        <div class="report-text">${d.relatorio}</div>
      </div>
    </div>` : ''}

  </div>`;

  // Carrega gráfico
  setTimeout(() => loadTVWidget('OANDA:XAUUSD'), 300);
}

// ── TRADINGVIEW ──────────────────────────────────────────────────────────────
let tvLoaded = false;

function loadTVWidget(symbol) {
  const container = document.getElementById('tv-container');
  if (!container) return;
  container.innerHTML = '';

  if (!tvLoaded) {
    const s = document.createElement('script');
    s.src = 'https://s3.tradingview.com/tv.js';
    s.onload = () => { tvLoaded = true; createWidget(symbol); };
    document.body.appendChild(s);
  } else {
    createWidget(symbol);
  }
}

function createWidget(symbol) {
  new TradingView.widget({
    container_id: 'tv-container',
    symbol, interval: '60',
    timezone: 'America/Sao_Paulo',
    theme: 'dark', style: '1', locale: 'br',
    toolbar_bg: '#0e1116',
    enable_publishing: false,
    hide_top_toolbar: false,
    backgroundColor: '#0e1116',
    gridColor: 'rgba(30,35,48,0.8)',
    width: '100%', height: 440,
    studies: ['Volume@tv-basicstudies'],
    disabled_features: ['header_symbol_search','header_screenshot','header_compare'],
  });
}

function switchChart(btn, symbol) {
  document.querySelectorAll('.chart-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  loadTVWidget(symbol);
}

// ── LIVE PRICES ──────────────────────────────────────────────────────────────
let lastPrices = {};

async function fetchLivePrices() {
  const prices = {};
  try {
    const r = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum&vs_currencies=usd&include_24hr_change=true', {cache:'no-store'});
    const d = await r.json();
    prices['BTC'] = {price:'$'+d.bitcoin.usd.toLocaleString('en-US',{maximumFractionDigits:0}), change:(d.bitcoin.usd_24h_change||0).toFixed(2)+'%', up:(d.bitcoin.usd_24h_change||0)>=0, raw:d.bitcoin.usd};
    prices['ETH'] = {price:'$'+d.ethereum.usd.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}), change:(d.ethereum.usd_24h_change||0).toFixed(2)+'%', up:(d.ethereum.usd_24h_change||0)>=0, raw:d.ethereum.usd};
  } catch {}
  try {
    const r = await fetch('https://api.frankfurter.app/latest?from=USD&to=GBP,EUR,JPY',{cache:'no-store'});
    const d = await r.json();
    if(d.rates.GBP) prices['GBPUSD']={price:(1/d.rates.GBP).toFixed(5),change:'—',up:true,raw:1/d.rates.GBP};
    if(d.rates.EUR) prices['EURUSD']={price:(1/d.rates.EUR).toFixed(5),change:'—',up:true,raw:1/d.rates.EUR};
    if(d.rates.JPY) prices['USDJPY']={price:d.rates.JPY.toFixed(3),change:'—',up:true,raw:d.rates.JPY};
  } catch {}
  return prices;
}

function updateTicker(prices) {
  Object.entries(prices).forEach(([sym,v]) => {
    const el = document.querySelector(`.ticker-item[data-sym="${sym}"]`);
    if (!el) return;
    const pe = el.querySelector('.t-price');
    const ce = el.querySelector('.t-chg');
    const prev = lastPrices[sym];
    if (prev && prev.raw !== v.raw) {
      pe.style.transition = 'color 0.15s';
      pe.style.color = v.raw > prev.raw ? 'var(--primary)' : 'var(--destructive)';
      setTimeout(() => { pe.style.color = ''; }, 800);
    }
    pe.textContent = v.price;
    const chgNum = parseFloat(v.change);
    ce.textContent = (!isNaN(chgNum) && chgNum >= 0 ? '+' : '') + v.change;
    ce.className = 't-chg ' + (v.up ? 'up' : 'dn');
  });

  const brt = new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Sao_Paulo',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(new Date());
  document.getElementById('ts').textContent = brt + ' BRT';
  lastPrices = {...lastPrices, ...prices};
}

async function refreshPrices() {
  updateTicker(await fetchLivePrices());
}

// ── INIT ─────────────────────────────────────────────────────────────────────
async function init() {
  try {
    const r = await fetch('report_data.json?t=' + Date.now());
    if (!r.ok) throw new Error();
    render(await r.json());
  } catch { render(DEMO); }
  await refreshPrices();
}

init();
setInterval(init, 5 * 60 * 1000);
setInterval(refreshPrices, 30 * 1000);
</script>
